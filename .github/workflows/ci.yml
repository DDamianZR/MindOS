name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ./schemas -e ./common
          pip install -r memory/requirements.txt -r agents/requirements.txt -r gateway/requirements.txt -r comms/requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Ruff (lint)
        run: ruff check .

      - name: Pytest (sin integración)
        run: pytest -m "not integration"

  build-images:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Build imagen memory
        run: docker build -f memory/Dockerfile -t mindos-memory:ci .

      - name: Build imagen agents
        run: docker build -f agents/Dockerfile -t mindos-agents:ci .

      - name: Build imagen gateway
        run: docker build -f gateway/Dockerfile -t mindos-gateway:ci .

      - name: Build imagen comms
        run: docker build -f comms/Dockerfile -t mindos-comms:ci .

      - name: Validar sintaxis de infra/docker-compose.yml
        run: |
          cd infra
          echo "JWT_SECRET=ci-placeholder" >> /tmp/ci.env
          echo "MINDOS_API_KEY=ci-placeholder" >> /tmp/ci.env
          echo "MINDOS_ADMIN_PASSWORD_HASH=ci-placeholder" >> /tmp/ci.env
          docker compose --env-file /tmp/ci.env config --quiet
