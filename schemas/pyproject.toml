[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindos-schemas"
version = "1.0.0"
description = "Contratos de datos versionados, eventos y esquemas de habilidades para MindOS"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mindos_schemas*"]
