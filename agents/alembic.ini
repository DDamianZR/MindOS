# Configuración de Alembic del servicio de agentes de MindOS (Fase 9).
# La URL real se inyecta desde agents.src.config.settings en alembic/env.py.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/..
path_separator = os
# Placeholder; env.py lo sobrescribe con settings.DATABASE_URL
sqlalchemy.url = postgresql+asyncpg://mindos_user:mindos_secure_password@localhost:5432/mindos_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
