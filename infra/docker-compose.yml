# Stack de producción de MindOS. Contexto de build = raíz del monorepo (..).
# Copia .env.example a .env (en la raíz) antes de levantar.
# Ollama se usa desde el HOST (host.docker.internal). Modelos: qwen3:8b + nomic-embed-text.
#
# F3-T2: Traefik es el ÚNICO servicio expuesto al host (80/443). Todo lo demás (Postgres,
# Redis, Memory, Agents, Gateway) vive solo en la red interna `mindos-net` — se alcanzan por
# nombre de servicio entre contenedores, nunca desde fuera del host. Para depurar directo
# (psql/redis-cli) usa `docker compose exec <servicio> ...` en vez de un puerto de host.

name: mindos

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindos-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindos_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-mindos_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindos_user} -d ${POSTGRES_DB:-mindos_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [mindos-net]

  redis:
    image: redis:7-alpine
    container_name: mindos-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [mindos-net]

  # One-shot: aplica las migraciones Alembic y termina. Memory depende de que complete OK.
  migrate:
    build:
      context: ..
      dockerfile: memory/Dockerfile
    container_name: mindos-migrate
    command: ["alembic", "-c", "memory/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_TYPE: postgres
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mindos_user}:${POSTGRES_PASSWORD:-mindos_secure_password}@postgres:5432/${POSTGRES_DB:-mindos_db}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [mindos-net]

  memory:
    build:
      context: ..
      dockerfile: memory/Dockerfile
    container_name: mindos-memory
    environment:
      MINDOS_ENV: ${MINDOS_ENV:-production}
      DATABASE_TYPE: postgres
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mindos_user}:${POSTGRES_PASSWORD:-mindos_secure_password}@postgres:5432/${POSTGRES_DB:-mindos_db}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      # F3-T6: filesystem local es suficiente para un solo host (mono-usuario); MinioStorage
      # queda disponible en código si más adelante se necesitan varias réplicas.
      STORAGE_TYPE: local_fs
      STORAGE_LOCAL_DIR: /data/storage
      # F3-T5: a dónde disparar un agente si el pipeline de ingestión detecta una pregunta.
      AGENTS_URL: http://agents:8002
    volumes:
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    mem_limit: 768m
    networks: [mindos-net]

  agents:
    build:
      context: ..
      dockerfile: agents/Dockerfile
    container_name: mindos-agents
    environment:
      MINDOS_ENV: ${MINDOS_ENV:-production}
      MEMORY_URL: http://memory:8001
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${LLM_MODEL_REASONING:-qwen3:8b}
    depends_on:
      memory:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    mem_limit: 768m
    networks: [mindos-net]

  comms:
    build:
      context: ..
      dockerfile: comms/Dockerfile
    container_name: mindos-comms
    environment:
      MINDOS_ENV: ${MINDOS_ENV:-production}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    networks: [mindos-net]

  # F3-T4: adaptador de WhatsApp (Baileys). Nunca se expone al host — conecta HACIA WhatsApp
  # (saliente) y HACIA comms (interno); nadie necesita llamarlo desde fuera del stack.
  whatsapp:
    build:
      context: ../whatsapp
      dockerfile: Dockerfile
    container_name: mindos-whatsapp
    environment:
      COMMS_URL: http://comms:8003
      PORT: "8004"
      WHATSAPP_AUTH_DIR: /app/auth_state
    volumes:
      - whatsapp_auth:/app/auth_state
    depends_on:
      comms:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 384m
    networks: [mindos-net]

  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    container_name: mindos-gateway
    environment:
      MINDOS_ENV: ${MINDOS_ENV:-production}
      MEMORY_URL: http://memory:8001
      AGENTS_URL: http://agents:8002
      COMMS_URL: http://comms:8003
      REDIS_URL: redis://redis:6379/0
      RATE_LIMITER_TYPE: redis
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      JWT_SECRET: ${JWT_SECRET:?La variable JWT_SECRET es obligatoria (ver .env.example)}
      MINDOS_API_KEY: ${MINDOS_API_KEY:?La variable MINDOS_API_KEY es obligatoria (ver .env.example)}
      MINDOS_ADMIN_USERNAME: ${MINDOS_ADMIN_USERNAME:-admin}
      MINDOS_ADMIN_PASSWORD_HASH: ${MINDOS_ADMIN_PASSWORD_HASH:?Genera un hash con scripts/hash_password.py}
    depends_on:
      memory:
        condition: service_healthy
      agents:
        condition: service_healthy
      comms:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    networks: [mindos-net]
    labels:
      - "traefik.enable=true"
      # Sin Host() explícito: el Gateway es el único servicio ruteado, y esto sirve tanto
      # acceso por IP/LAN (sin dominio) como por dominio real, sin duplicar routers.
      - "traefik.http.routers.gateway.rule=PathPrefix(`/`)"
      - "traefik.http.routers.gateway.entrypoints=websecure"
      - "traefik.http.routers.gateway.tls=true"
      # Sin MINDOS_ACME_EMAIL o sin DNS público apuntando al host, el challenge ACME
      # simplemente no puede completarse (Let's Encrypt no puede alcanzar el host) y Traefik
      # sirve su certificado autofirmado por defecto — TLS sigue activo, solo sin CA pública.
      - "traefik.http.routers.gateway.tls.certresolver=letsencrypt"
      - "traefik.http.services.gateway.loadbalancer.server.port=8000"

  # F3-T2: único servicio expuesto al host. Con MINDOS_ACME_EMAIL configurado en .env Y el
  # puerto 80 alcanzable desde internet (dominio real con DNS apuntando aquí), Traefik emite
  # un certificado Let's Encrypt real; si no, sirve su autofirmado por defecto (LAN sin dominio).
  traefik:
    image: traefik:v3.1
    container_name: mindos-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=mindos-net"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${MINDOS_ACME_EMAIL:-}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--api.dashboard=false"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    networks: [mindos-net]

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local
  traefik_certs:
    driver: local
  whatsapp_auth:
    driver: local

networks:
  mindos-net:
    driver: bridge
